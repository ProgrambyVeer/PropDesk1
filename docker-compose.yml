services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: propcrm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    depends_on: [db]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/propcrm?schema=public
      NODE_ENV: production
    ports: ["4000:4000"]
    volumes: [uploads:/app/uploads]
volumes:
  pgdata:
  uploads:
